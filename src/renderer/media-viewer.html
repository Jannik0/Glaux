<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="viewer.windowTitle">Media Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="theme.css" />
    <style>
      html:not([data-i18n-ready]) body {
        visibility: hidden;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: var(--bg-body);
        color: var(--text-body);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .hidden {
        display: none !important;
      }

      .viewer-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        background: var(--bg-app);
        border-bottom: 1px solid var(--border-app);
        flex-shrink: 0;
      }

      .viewer-title {
        flex: 1;
        min-width: 0;
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .viewer-content {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }

      .viewer-content.image-mode {
        padding: 0;
        background: var(--viewer-image-bg);
      }

      .viewer-content.audio-mode {
        padding: 24px;
      }

      .viewer-content.video-mode {
        padding: 0;
        background: var(--viewer-video-bg);
      }

      .viewer-content.pdf-mode {
        padding: 0;
        background: var(--viewer-pdf-bg);
      }

      #media-image {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        display: block;
      }

      #media-audio {
        width: 100%;
        max-width: 420px;
      }

      #media-video {
        width: 100%;
        height: 100%;
        max-height: 100%;
        object-fit: contain;
        background: var(--viewer-video-bg);
      }

      #media-pdf {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
        background: var(--viewer-pdf-bg);
      }

      .viewer-loading,
      .viewer-error {
        font-size: 14px;
        color: var(--text-muted);
        text-align: center;
        padding: 24px;
      }

      .viewer-error {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <header class="viewer-header">
      <div class="viewer-title" id="viewer-title" data-i18n="viewer.loading">Loading...</div>
    </header>

    <div class="viewer-content" id="viewer-content">
      <div class="viewer-loading" id="viewer-loading" data-i18n="viewer.loadingMedia">Loading media...</div>
      <img id="media-image" class="hidden" alt="" />
      <audio id="media-audio" class="hidden" controls preload="metadata"></audio>
      <video id="media-video" class="hidden" controls preload="metadata"></video>
      <iframe id="media-pdf" class="hidden" data-i18n-title="viewer.pdfTitle" title="PDF document"></iframe>
      <div class="viewer-error hidden" id="viewer-error"></div>
    </div>

    <script src="../i18n/translate.js"></script>
    <script src="i18n/i18n.js"></script>
    <script src="./media-viewer.js"></script>
  </body>
</html>
